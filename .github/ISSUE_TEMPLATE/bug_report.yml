name: Bug report
description: Something breaks while reading a design
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The error message, if there is one, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Selected a frame in Figma and pressed ⌘C
        2. Asked the assistant to read the design
        3. ...
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Clipboard or a .fig file, and roughly how large the selection was.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version, Node version, macOS version, MCP client.
      placeholder: figma-clipboard-mcp 0.1.0, Node 22.14, macOS 15.4, Claude Code
    validations:
      required: true
