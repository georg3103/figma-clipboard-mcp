name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release works out the next version from the full tag history.
          fetch-depth: 0

      # No registry-url here on purpose: it writes an .npmrc line expecting NODE_AUTH_TOKEN,
      # and an empty token makes npm publish anonymously - which the registry answers with a 404.
      # Authentication comes from GitHub's OIDC token instead: npmjs.com lists this repository
      # and this workflow file as a trusted publisher for the package.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
