name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url here on purpose: it writes an .npmrc line expecting NODE_AUTH_TOKEN,
      # and an empty token makes npm publish anonymously - which the registry answers with a 404.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer, which Node does not ship yet.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      # Trusted publishing needs npm 11.5.1+ and an OIDC token from the runner.
      - name: Report the publishing prerequisites
        run: |
          echo "npm     $(npm --version)"
          echo "node    $(node --version)"
          echo "oidc url set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no}"
          echo "npmrc:"; cat ~/.npmrc 2>/dev/null || echo "  (none)"

      - run: npm ci
      - run: npm test

      - name: Check the tag against the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg." >&2
            echo "Run 'npm version' so the two move together." >&2
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
        id: version

      # Authentication comes from GitHub's OIDC token, so there is no npm secret to keep:
      # npmjs.com must list this repository and workflow as a trusted publisher for the package.
      # Skipped when the version is already on the registry, so re-pushing a tag is harmless.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "figma-clipboard-mcp@$VERSION" version > /dev/null 2>&1; then
            echo "figma-clipboard-mcp@$VERSION is already published, skipping."
          else
            npm publish --access public
          fi

      - name: Take the release notes from the changelog
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for the details of this release." > notes.md
          fi
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
